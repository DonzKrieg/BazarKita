name: Frontend foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip
          tools: composer:2.10
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: composer test
      - run: vendor/bin/pint --test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip
          tools: composer:2.10
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Verify distribution excludes upstream fixtures
        shell: pwsh
        run: |
          if (Test-Path vendor/vlucas/phpdotenv/tests) {
            throw 'phpdotenv must be installed from its distribution archive, without upstream test fixtures.'
          }
          if (-not (Test-Path vendor/autoload.php)) {
            throw 'Composer installation is incomplete.'
          }
      - run: php artisan --version
      - run: php artisan route:list --except-vendor
